name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.package.outputs.commit }}
      filename: ${{ steps.package.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'

      - name: Verify package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { version } = require('./package.json')
          const lock = require('./package-lock.json')
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must match package version v${version}`)
          }
          if (lock.version !== version || lock.packages[''].version !== version) {
            throw new Error('package-lock.json must match the version in package.json')
          }
          NODE

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Build npm tarball
        id: package
        run: |
          mkdir dist
          npm pack --pack-destination dist
          packages=(dist/*.tgz)
          if [[ ${#packages[@]} -ne 1 || ! -f "${packages[0]}" ]]; then
            echo '::error::Expected one npm tarball in dist'
            exit 1
          fi
          printf 'filename=%s\ncommit=%s\n' "${packages[0]#dist/}" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: dist/${{ steps.package.outputs.filename }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          PACKAGE_NAME: ${{ needs.build.outputs.filename }}
        run: |
          package="dist/$PACKAGE_NAME"
          tag_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo '::error::The tag no longer points to the commit that was built'
            exit 1
          fi

          if release="$(gh release view "$RELEASE_TAG" --json assets,isDraft)"; then
            if jq -e --arg name "$PACKAGE_NAME" '.assets | any(.name == $name)' <<< "$release" >/dev/null; then
              previous="$RUNNER_TEMP/$PACKAGE_NAME"
              gh release download "$RELEASE_TAG" --pattern "$PACKAGE_NAME" --output "$previous"
              if ! cmp -s "$package" "$previous"; then
                echo '::error::This tag already has a different package with the same filename'
                exit 1
              fi
            else
              gh release upload "$RELEASE_TAG" "$package"
            fi
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            release_args=(--verify-tag --title "dsh-safety $RELEASE_TAG" --generate-notes)
            if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$package" "${release_args[@]}"
          fi
